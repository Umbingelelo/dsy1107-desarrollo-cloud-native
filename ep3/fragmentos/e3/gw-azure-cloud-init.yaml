#cloud-config
# gw-azure: Docker y NAT de la subred privada 10.1.2.0/24 (pasos 2, 3 y 6 del NAT).
# OJO: este archivo tiene que ser ASCII puro, sin tildes ni enes: con un caracter no ASCII,
# cloud-init lo descarta entero y no avisa ('cloud-init status' igual dice done).
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - iptables-persistent
write_files:
  - path: /etc/sysctl.d/99-nat.conf
    content: |
      net.ipv4.ip_forward=1
runcmd:
  - sysctl --system
  # Interfaz de salida: la de la ruta por defecto (eth0 en Ubuntu 24.04 en Azure).
  - IF=$(ip route show default | awk '{print $5; exit}'); iptables -t nat -A POSTROUTING -s 10.1.2.0/24 -o "$IF" -j MASQUERADE
  # Docker deja la politica FORWARD en DROP: se permite explicitamente la subred privada.
  - iptables -I DOCKER-USER -s 10.1.2.0/24 -j ACCEPT
  - iptables -I DOCKER-USER -d 10.1.2.0/24 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
  - netfilter-persistent save
  - usermod -aG docker azureuser
